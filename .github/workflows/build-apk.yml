name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is empty or not set."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          ls -la android/app/release.keystore
          file android/app/release.keystore

      - name: Diagnostics
        working-directory: android
        run: |
          echo "=== JAVA_HOME ==="
          echo "$JAVA_HOME"
          java -version 2>&1
          echo "=== tools.jar present? ==="
          ls -la "$JAVA_HOME/lib/tools.jar" 2>/dev/null || echo "tools.jar missing"
          echo "=== vector-icons fonts.gradle present? ==="
          ls -la ../node_modules/react-native-vector-icons/fonts.gradle 2>/dev/null || echo "fonts.gradle missing"
          echo "=== build.gradle apply lines ==="
          grep -n "apply from" app/build.gradle || echo "no apply from lines"
          echo "=== keystore file ==="
          ls -la app/release.keystore 2>/dev/null || echo "keystore missing"
          echo "=== gradle version ==="
          ./gradlew --version --no-daemon 2>&1 | head -20

      - name: Build Release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace --info

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Show APK info
        if: always()
        run: |
          ls -lh android/app/build/outputs/apk/release/ 2>/dev/null || echo "no release apk produced"
          echo "Build finished"
